    avatar = "https://avatars.githubusercontent.com/u/26762336?s=400&u=897a77ff678657345a82d196b192f2fd8fcaca06&v=4"
    name = "Hello, I'm Isaac Owomugisha"
    fullName = "Isaac Owomugisha"
    bio = "Software engineer and perpetual learner. I like digging into CS and math for fun: algorithms, distributed systems, graphics, performance engineering, and AI. This site is where I explore and write about what I learn."
