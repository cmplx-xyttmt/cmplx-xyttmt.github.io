{{ $id := printf "atcoder-device-%d" (now.UnixNano) }}

<div class="atcoder-device not-prose" id="{{ $id }}">
    <div class="device-caption">Interactive &middot; AtCoder device</div>
    <div class="device-screen">
        <span class="display-text"></span>
    </div>
    <div class="device-buttons">
        <button type="button" class="button-a">Button A</button>
        <button type="button" class="button-b">Button B</button>
        <button type="button" class="button-clear">Clear</button>
    </div>
    <div class="device-challenge">
        <div class="challenge-info">
            <div class="target-string">Target <span class="target-value"></span></div>
            <div class="moves">Moves <span class="moves-count">0</span></div>
            <div class="expected-moves">Expected minimum moves <span class="expected-value"></span></div>
        </div>
        <div class="challenge-status"></div>
        <button type="button" class="new-challenge-btn">New Challenge</button>
    </div>
</div>

<style>
/* Notebook design: flat panel, tokens from assets/custom.css. */
.atcoder-device {
    max-width: 600px;
    margin: 2rem auto;
    padding: 20px 22px 22px;
    border: 1px solid var(--rule);
    border-radius: var(--radius-card);
    background: var(--panel);
    color: var(--text);
    font-family: var(--font-sans);
}

.atcoder-device .device-caption {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
}
.atcoder-device .device-caption::before {
    content: "";
    width: 7px;
    height: 7px;
    background: var(--accent);
    flex-shrink: 0;
}

/* The device's display: inverted ink panel so it reads as a screen. */
.atcoder-device .device-screen {
    background: var(--ink);
    color: var(--page);
    padding: 0 16px;
    margin-bottom: 12px;
    border-radius: var(--radius);
    font-family: var(--font-mono);
    font-size: 1.5rem;
    height: 3.5rem;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow: hidden;
    white-space: nowrap;
}

/* In dark mode an inverted screen would be a bright slab, so sink it instead. */
.dark .atcoder-device .device-screen {
    background: var(--page);
    color: var(--ink);
    border: 1px solid var(--line);
}

.atcoder-device .device-buttons {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
}

.atcoder-device button {
    min-height: 40px;
    padding: 0 16px;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border-radius: var(--radius);
    transition: background 0.15s ease, border-color 0.15s ease;
}
.atcoder-device button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
}

.atcoder-device .device-buttons button {
    flex: 1;
    background: var(--accent);
    color: var(--on-accent);
    border: 1px solid var(--accent);
}
.atcoder-device .device-buttons button:hover:not(:disabled) {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
}

.atcoder-device .device-buttons .button-clear,
.atcoder-device .new-challenge-btn {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
}
.atcoder-device .device-buttons .button-clear:hover,
.atcoder-device .new-challenge-btn:hover {
    background: transparent;
    border-color: var(--ink);
}

.atcoder-device .device-challenge {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
}

.atcoder-device .challenge-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
}

.atcoder-device .challenge-info > div {
    display: flex;
    align-items: baseline;
    gap: 10px;
}
.atcoder-device .challenge-info span {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--ink);
}

.atcoder-device .challenge-status {
    margin-top: 12px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
}
.atcoder-device .challenge-status:empty {
    display: none;
}

/* Reached the target in the fewest moves: green. Reached it, but in
   more moves: accent. Each also has a different marker glyph. */
.atcoder-device .challenge-status.success {
    padding: 10px 14px;
    border-radius: var(--radius);
    background: var(--green-soft);
    border-left: 3px solid var(--green);
}
.atcoder-device .challenge-status.success::before {
    content: "\2713  ";
    color: var(--green);
}
.atcoder-device .challenge-status.failure {
    padding: 10px 14px;
    border-radius: var(--radius);
    background: var(--accent-soft);
    border-left: 3px dashed var(--accent);
}
.atcoder-device .challenge-status.failure::before {
    content: "\2192  ";
    color: var(--accent);
}

.atcoder-device .new-challenge-btn {
    display: block;
    width: 100%;
    margin-top: 14px;
}

@media (max-width: 480px) {
    .atcoder-device { padding: 16px; }
    .atcoder-device .device-buttons button { padding: 0 8px; }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const device = document.getElementById('{{ $id }}');
    const display = device.querySelector('.display-text');
    const buttonA = device.querySelector('.button-a');
    const buttonB = device.querySelector('.button-b');
    const buttonClear = device.querySelector('.button-clear');
    const newChallengeBtn = device.querySelector('.new-challenge-btn');
    const movesCount = device.querySelector('.moves-count');
    const targetValue = device.querySelector('.target-value');
    const expectedValue = device.querySelector('.expected-value');
    const challengeStatus = device.querySelector('.challenge-status');
    
    let currentString = '';
    let moves = 0;
    
    // Challenge configuration
    const challenges = [
        { target: "0", expected: 1 },
        { target: "1", expected: 2 },
        { target: "10", expected: 3 },
        { target: "123", expected: 24 },
        { target: "21", expected: 4 },
        { target: "407", expected: 17 }
    ];
    let currentChallenge = 0;
    
    function updateDisplay() {
        display.textContent = currentString || ' ';
        movesCount.textContent = moves;
        
        // Enable/disable Button B based on display content
        buttonB.disabled = currentString === '';
        buttonB.style.opacity = currentString === '' ? '0.5' : '1';
        buttonB.style.cursor = currentString === '' ? 'not-allowed' : 'pointer';
        
        // Check if target is reached
        if (currentString === challenges[currentChallenge].target) {
            if (moves === challenges[currentChallenge].expected) {
                challengeStatus.textContent = "Perfect! You found the minimum number of moves!";
                challengeStatus.className = "challenge-status success";
            } else {
                challengeStatus.textContent = `Good! You reached the target, but can you do it in ${challenges[currentChallenge].expected} moves?`;
                challengeStatus.className = "challenge-status failure";
            }
        } else {
            challengeStatus.textContent = "";
            challengeStatus.className = "challenge-status";
        }
    }
    
    function pressButtonA() {
        currentString += '0';
        moves++;
        updateDisplay();
    }
    
    function pressButtonB() {
        currentString = currentString.split('').map(digit => {
            if (digit === '9') return '0';
            return String(Number(digit) + 1);
        }).join('');
        moves++;
        updateDisplay();
    }

    function clearDisplay() {
        currentString = '';
        moves = 0;
        updateDisplay();
    }
    
    function loadChallenge() {
        const challenge = challenges[currentChallenge];
        targetValue.textContent = challenge.target;
        expectedValue.textContent = challenge.expected;
        clearDisplay();
    }

    function getRandomChallenge() {
        // Get a random index different from the current one
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * challenges.length);
        } while (newIndex === currentChallenge && challenges.length > 1);
        
        currentChallenge = newIndex;
        loadChallenge();
    }
    
    buttonA.addEventListener('click', pressButtonA);
    buttonB.addEventListener('click', pressButtonB);
    buttonClear.addEventListener('click', clearDisplay);
    newChallengeBtn.addEventListener('click', getRandomChallenge);
    
    // Initialize the first challenge
    loadChallenge();
});
</script>
